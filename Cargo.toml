[package]
name = "idx-prism"
version = "0.1.0"
edition = "2021"
description = "High-performance pipeline for parsing IDX financial disclosures and computing market microstructure metrics"
license = "MIT"
# Prose drifts; this does not. A dependency (aes) sets the true floor at 1.89,
# measured by building against 1.87 (fails) and 1.89 (passes). Declaring it here
# makes cargo refuse an older toolchain with a clear message instead of leaving a
# stale badge to mislead. Bump only after measuring the same way.
rust-version = "1.89"

[features]
default = []
# Opt-in second extraction channel: render the named page and ask a vision model
# to read the appraiser off it, then verify every quote against the page's own
# text layer. Off by default because it pulls a rasteriser and a TLS stack, needs
# network + credentials, and costs money per page. The default build stays lean.
vlm = ["dep:ureq", "dep:base64", "pdf_oxide/rendering"]

[dependencies]
base64 = { version = "0.23", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
pdf_oxide = "0.3"
quick-xml = "0.36"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3", features = ["rustls", "json"], default-features = false, optional = true }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
