[package]
name = "idx-prism"
version = "0.1.0"
edition = "2021"
description = "High-performance pipeline for parsing IDX financial disclosures and computing market microstructure metrics"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
pdf_oxide = "0.3"
quick-xml = "0.36"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
